# Config for the GitHub Actions runs (.github/workflows/oss-bot.yml); the local config.yaml is
# not checked in. Repos come from repos/*.yaml as usual. This file is public: no secrets here.
# Secrets live in the repo (COPILOT_TOKEN) and in the environment "bot" (OSS_BOT_TOKEN,
# DESK_TOKEN, OSS_BOT_SIGNING_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID).
github_user: beiryu
# Written from the OSS_BOT_SIGNING_KEY secret by the publish job, the only one that commits.
commit_signing_key: ~/.ssh/oss-bot-signing

limits:
  max_open_prs_per_repo: 4
  max_triage_per_run: 5
  min_score: 0.5
  max_attempts: 3
  min_free_disk_gb: 10          # a runner has ~14 GB after the workflow frees the preinstalled SDKs
  max_go_build_cache_gb: 10

budget:
  max_cost_per_call_usd: 3

sandbox:
  image: oss-bot-sandbox        # pulled from ghcr.io and tagged with this name by the workflow
  memory: 12g                   # a standard Linux runner has 16 GB
  cpus: "4"
  runtime: copilot
  auth_env: COPILOT_GITHUB_TOKEN
  cache_volume: oss-bot-cache
  agent_timeout_min: 30
  gate_timeout_min: 60

notify: {}                      # TELEGRAM_CHAT_ID comes from the environment
