# oss-bot on GitHub Actions: one pass over every repos/*.yaml, in two jobs (see src/ci.ts).
#
#   agent    the job's read-only token and the model credential (COPILOT_TOKEN). Agents and gate
#            commands run in the oss-bot-sandbox container, as on a laptop. Posts nothing; hands
#            over the state file.
#   publish  environment "bot": your classic PAT (OSS_BOT_TOKEN, public repos), a token for the
#            private desk (DESK_TOKEN), the commit signing key and the Telegram token, no model
#            credential. Carries out the commands you commented on the
#            dashboard issue in the desk repo (the only way anything reaches an upstream repo),
#            renders the dashboard, notifies, and saves the state on the branch oss-bot/state.
#
# A comment on the dashboard reaches here through the desk's relay workflow
# (templates/desk-relay.yml), which starts a `commands_only` run: publish alone, a minute or two.
name: oss-bot

on:
  schedule:
    - cron: '7 */2 * * *'
  workflow_dispatch:
    inputs:
      commands_only:
        description: only carry out the dashboard commands and refresh the dashboard (no agents)
        type: boolean
        default: false

# One pass at a time: both jobs read and write the same state. A queued run waits; it is not cancelled.
concurrency:
  group: oss-bot
  cancel-in-progress: false

permissions: {}

env:
  DESK: beiryu/maintainer-desk
  STATE: ${{ github.workspace }}/state/state.json
  IMAGE: ghcr.io/${{ github.repository_owner }}/oss-bot-sandbox

jobs:
  image:
    # The sandbox image, rebuilt only when docker/Dockerfile changes (the tag is its hash).
    if: ${{ !inputs.commands_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tag
        run: echo "ref=$IMAGE:${{ hashFiles('docker/Dockerfile') }}" >> "$GITHUB_OUTPUT"
      - name: Build and push when missing
        env:
          REF: ${{ steps.tag.outputs.ref }}
          TOKEN: ${{ github.token }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$REF" >/dev/null 2>&1; then echo "$REF exists"; exit 0; fi
          docker build -t "$REF" docker/
          docker push "$REF"

  agent:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 240      # ci agent starts no new step after 150 min; one issue can take ~1.5 h more
    permissions:
      contents: read
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Free disk space
        # Clones, Go build output and the image need the room; the runner ships SDKs we never use.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Sandbox image
        env:
          REF: ${{ needs.image.outputs.ref }}
          TOKEN: ${{ github.token }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull -q "$REF" && docker tag "$REF" oss-bot-sandbox
      - name: Mirrors
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/_mirror
          key: mirrors-${{ github.run_id }}
          restore-keys: mirrors-
      - name: Load state
        run: npx tsx src/cli.ts -c config.ci.yaml --state "$STATE" ci state-pull --repo "$GITHUB_REPOSITORY"
      - name: Run the agents
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          if [ -z "$COPILOT_GITHUB_TOKEN" ]; then echo "::error::add the repo secret COPILOT_TOKEN (fine-grained PAT, Copilot Requests only)"; exit 1; fi
          npx tsx src/cli.ts -c config.ci.yaml --state "$STATE" ci agent --minutes 150
      - name: Hand over the state
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oss-bot-state
          path: state/state.json
          retention-days: 3
          if-no-files-found: ignore

  publish:
    needs: [image, agent]
    # After the agent; alone for a dashboard comment; and with the branch's state when the agent broke.
    if: ${{ always() && needs.agent.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: bot
    permissions:
      packages: read
    env:
      GH_TOKEN: ${{ secrets.OSS_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Credentials
        env:
          KEY: ${{ secrets.OSS_BOT_SIGNING_KEY }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::add OSS_BOT_TOKEN (classic PAT, public_repo) to the environment \"bot\""; exit 1; fi
          if [ -z "$KEY" ]; then echo "::error::add OSS_BOT_SIGNING_KEY (the SSH signing key) to the environment \"bot\""; exit 1; fi
          install -d -m 700 ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/oss-bot-signing && chmod 600 ~/.ssh/oss-bot-signing
      - name: Sandbox image
        # Only after_commit runs here (an approved PR on a repo that regenerates files), never with the PAT inside.
        # By its tag, not from the image job: a commands_only run skips that job, and /approve needs the image most.
        env:
          REF: ${{ env.IMAGE }}:${{ hashFiles('docker/Dockerfile') }}
          TOKEN: ${{ github.token }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker pull -q "$REF"; then docker tag "$REF" oss-bot-sandbox
          else echo "::warning::no $REF yet (a full run builds it); approving a PR on a repo with after_commit fails until then"; fi
      - name: State from the agent
        if: ${{ needs.agent.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oss-bot-state
          path: state
      - name: State from the branch
        if: ${{ needs.agent.result != 'success' }}
        run: npx tsx src/cli.ts -c config.ci.yaml --state "$STATE" ci state-pull --repo "$GITHUB_REPOSITORY"
      - name: Publish
        env:
          DESK_TOKEN: ${{ secrets.DESK_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$DESK_TOKEN" ]; then echo "::error::add DESK_TOKEN (fine-grained, Issues read/write on $DESK only) to the environment \"bot\""; exit 1; fi
          npx tsx src/cli.ts -c config.ci.yaml --state "$STATE" ci publish --repo "$GITHUB_REPOSITORY" --desk "$DESK" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
